image:
  repository: ghcr.io/jacekgos/connector-service
  tag: latest            # CI pushes :<sha> and :latest; ArgoCD/CD overrides with sha
  pullPolicy: IfNotPresent
imagePullSecrets: []     # e.g. [{name: ghcr-pull}] if the GHCR package is private

replicaCount: 1

service:
  type: ClusterIP
  port: 8080

resources:
  requests: { cpu: 250m, memory: 256Mi }
  limits:   { cpu: 500m, memory: 512Mi }

# Non-secret env -> ConfigMap
config:
  KAFKA_BOOTSTRAP_SERVERS: redpanda.iiot-dev.svc.cluster.local:9093
  CORE_PLATFORM_URL: http://iiot-core-platform.iiot-dev.svc.cluster.local:8081
  MANAGEMENT_ENDPOINT_HEALTH_PROBES_ENABLED: "true"
  LOGGING_LEVEL_COM_IIOT_CONNECTOR: INFO

# Secret env. If existingSecret is set, the chart's Secret is not rendered.
secret:
  existingSecret: ""
  data: {}               # e.g. MQTT_USERNAME / MQTT_PASSWORD later

probes:
  liveness:
    path: /actuator/health/liveness
    initialDelaySeconds: 30
    periodSeconds: 10
    failureThreshold: 3
  readiness:
    path: /actuator/health/readiness
    initialDelaySeconds: 15
    periodSeconds: 10
    failureThreshold: 3
